<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifex — Personaliza tu viaje</title>
<link rel="icon" href="assets/logo/lifex-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/lifex.css">
</head>
<body data-page="customize">
<header id="shell-header"></header>
<main id="main" class="co-main">
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:26px">
      <h1 class="co-title" style="margin:0" data-i18n="title"></h1>
      <a class="back-link" href="pasajeros.html" style="margin:0"><span id="bi"></span><span data-i18n="back.pax"></span></a>
    </div>
    <div class="opts" id="opts"></div>
  </div>
</main>
<footer id="shell-footer"></footer>
<script src="assets/js/app.js"></script>
<script>
(function () {
  LX.add({
    es: {
      title: "Personaliza tu viaje", "back.pax": "Volver a datos personales",
      "seat.h": "Elige tu asiento", "seat.p": "No lo dejes al azar, asegura el asiento que más te guste.", "bag.h": "Equipaje adicional", "bag.p": "¡No esperes al aeropuerto! Ahorra tiempo y dinero añadiéndolo ahora.", "sport.h": "Equipaje deportivo", "sport.p": "Lleva tu pasión a todas partes. Viaja con tu equipo deportivo.",
      free: "Gratis", choose: "Elegir", from: "Desde", added: "Total adicionado", add: "Agregar", dec: "Quitar uno", inc: "Agregar uno"
    },
    en: {
      title: "Customize your trip", "back.pax": "Back to passenger details",
      "seat.h": "Choose your seat", "seat.p": "Don't leave it to chance, secure the seat you like most.", "bag.h": "Extra baggage", "bag.p": "Don't wait for the airport! Save time and money by adding it now.", "sport.h": "Sports equipment", "sport.p": "Take your passion everywhere. Travel with your sports gear.",
      free: "Free", choose: "Choose", from: "From", added: "Total added", add: "Add", dec: "Remove one", inc: "Add one"
    }
  });
  var S = LX.ensureFare(), $ = function (id) { return document.getElementById(id); };
  var seatHref = LX.FARES[S.fare].cab === "business" ? "asientos-business.html" : "asientos-economy.html";
  LX.init({ kind: "co", step: 3, summary: { back: "pasajeros.html", next: "pago.html", label: "pay" } });
  $("bi").innerHTML = LX.ico("arrow-left");

  function seatCard() {
    var biz = LX.FARES[S.fare].cab === "business", e = LX.extras(S), chosen = !!S.seat;
    var low = biz ? 0 : LX.seatPrice("std", S);
    var foot = chosen ? '<div><small>' + LX.t("added") + "</small><b class=\"num\">" + LX.money(e.seat) + "</b></div><div style=\"display:flex;gap:6px\"><span class=\"btn btn-ghost btn-sm\" style=\"padding:0 12px\" aria-hidden=\"true\">" + LX.ico("edit") + '</span><button class="btn btn-ghost btn-sm" type="button" id="seatDel" style="padding:0 12px" aria-label="' + LX.t("remove") + '">' + LX.ico("trash") + "</button></div>"
      : '<div><small>' + LX.t("from") + "</small><b class=\"num\">" + (low === 0 ? LX.t("free") : LX.money(low)) + '</b></div><a class="btn btn-ghost btn-sm" href="' + seatHref + '">' + LX.t("choose") + "</a>";
    return '<article class="opt' + (chosen ? " chosen" : "") + '" id="optSeat"><div class="art">' + LX.ico("seat") + "</div><h3>" + LX.t("seat.h") + "</h3><p>" + LX.t("seat.p") + '</p><div class="foot">' + foot + "</div></article>";
  }
  function qtyCard(key, icon, hk, pk, unit) {
    var n = S[key] || 0;
    var foot = n ? '<div><small>' + LX.t("added") + '</small><b class="num">' + LX.money(unit * n) + '</b></div><div class="qty"><button type="button" data-k="' + key + '" data-d="-1" aria-label="' + LX.t("dec") + '">−</button><output>' + n + '</output><button type="button" data-k="' + key + '" data-d="1" aria-label="' + LX.t("inc") + '">+</button></div>'
      : '<div><small>' + LX.t("from") + '</small><b class="num">' + LX.money(unit) + '</b></div><button class="btn btn-ghost btn-sm" type="button" data-k="' + key + '" data-d="1">' + LX.t("add") + "</button>";
    return '<article class="opt' + (n ? " chosen" : "") + '"><div class="art">' + LX.ico(icon) + "</div><h3>" + LX.t(hk) + "</h3><p>" + LX.t(pk) + '</p><div class="foot">' + foot + "</div></article>";
  }
  function render() {
    S = LX.state(); var e = LX.extras(S);
    $("opts").innerHTML = seatCard() + qtyCard("bags", "luggage", "bag.h", "bag.p", e.bagUnit) + qtyCard("sport", "bike", "sport.h", "sport.p", e.sportUnit);
    $("optSeat").addEventListener("click", function (ev) { if (!ev.target.closest("a,button")) location.href = seatHref; });
    var del = $("seatDel"); if (del) del.addEventListener("click", function (ev) { ev.preventDefault(); ev.stopPropagation(); LX.save({ seat: null }); render(); LX.refreshSummary(); });
    $("opts").querySelectorAll("[data-k]").forEach(function (b) { b.addEventListener("click", function () { var k = b.getAttribute("data-k"), v = Math.max(0, Math.min(3, (S[k] || 0) + (+b.getAttribute("data-d")))); var p = {}; p[k] = v; LX.save(p); render(); LX.refreshSummary(); }); });
  }
  LX.onLang(function () { render(); LX.apply(); });
})();
</script>
</body>
</html>
