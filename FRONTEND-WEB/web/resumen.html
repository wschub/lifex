<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifex — Resumen de viaje</title>
<link rel="icon" href="assets/logo/lifex-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/lifex.css">
</head>
<body data-page="summary">
<header id="shell-header"></header>
<main id="main" class="co-main">
  <div class="wrap">
    <h1 class="co-title" data-i18n="title"></h1>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:26px 0 14px;flex-wrap:wrap">
      <h2 id="legTitle" style="font-size:24px"></h2>
      <a class="link" href="tarifas.html" data-i18n="edit.sel"></a>
    </div>
    <article class="sel-flight" id="sel"></article>
    <section class="panel" style="margin-top:24px;padding:26px 30px" aria-labelledby="incl"><h2 id="incl" style="font-size:22px;margin-bottom:16px" data-i18n="incl"></h2><ul class="fare" id="items" style="border:0;padding:0;cursor:default;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 32px;list-style:none;margin:0"></ul>
      <p style="margin-top:18px;color:var(--gray);font-size:14.5px" data-i18n="taxes.incl"></p></section>
  </div>
</main>
<footer id="shell-footer"></footer>
<script src="assets/js/app.js"></script>
<script>
(function () {
  LX.add({
    es: { title: "Resumen de viaje", "edit.sel": "Editar selección", incl: "Lo que incluye tu tarifa", leg: "Ida: {from} a {to}" },
    en: { title: "Trip summary", "edit.sel": "Edit selection", incl: "What your fare includes", leg: "Outbound: {from} to {to}" }
  });
  var S = LX.ensureFare();
  LX.init({ kind: "co", step: 1, summary: { next: "pasajeros.html" } });
  var $ = function (id) { return document.getElementById(id); };
  function render() {
    S = LX.state(); $("items").innerHTML = LX.fareItems(S.fare).map(function (a) { return '<li style="display:flex;gap:11px;align-items:flex-start;' + (a[1] ? "" : "color:var(--gray-soft)") + '">' + LX.ico(a[2]) + "<span>" + LX.t(a[0]) + "</span></li>"; }).join("");
    var info = LX.routeInfo(S.from, S.to), ft = LX.flightTimes(S.depTime || info.dep, info.dur, info.tz);
    $("legTitle").innerHTML = LX.t("leg", { from: LX.city(S.from), to: LX.city(S.to) }) + ' <span style="font:400 16px var(--font-text);color:var(--gray);margin-left:10px">' + LX.fmtDate(S.dep, { weekday: "long", day: "numeric", month: "short", year: "numeric" }) + "</span>";
    $("sel").innerHTML = '<span class="tick">' + LX.ico("check") + '</span><div class="flight-main"><div class="fl-time num">' + ft.dep + "<small>" + S.from + '</small></div><div class="fl-line"><b>' + LX.t("direct") + "</b> · " + LX.dur(info.dur) + '<div class="track">' + LX.ico("plane") + "</div>" + LX.t("operated") + '</div><div class="fl-time num" style="text-align:right">' + ft.arr + (ft.next ? '<sup style="font:500 13px var(--font-text);color:var(--gray);margin-left:4px">' + LX.t("next.day") + "</sup>" : "") + "<small>" + S.to + '</small></div></div><div class="fare-name"><b class="cab">' + LX.fareLabel(S.fare) + '</b><span class="price num">' + LX.money(LX.farePrice(S.fare, S)) + "</span></div>";
  }
  LX.onLang(function () { render(); LX.apply(); });
})();
</script>
</body>
</html>
