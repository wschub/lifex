<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifex — Pago</title>
<link rel="icon" href="assets/logo/lifex-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/lifex.css">
</head>
<body data-page="payment">
<header id="shell-header"></header>
<main id="main" class="co-main" style="padding-bottom:60px">
  <div class="wrap">
    <a class="back-link" href="personaliza.html"><span id="bi"></span><span data-i18n="back"></span></a>
    <h1 class="co-title" data-i18n="title"></h1>
    <div class="pay-grid" style="margin-top:24px">
      <form id="payForm" novalidate>
        <div class="pay-methods">
          <label class="pay-method"><div class="row"><input type="radio" name="pm" value="card" checked><span data-i18n="m.card"></span><span class="logos" aria-hidden="true"><span>VISA</span><span>MC</span><span>AMEX</span></span></div>
            <div class="pay-detail"><div class="form-grid">
              <div class="field c6" data-f="cn"><label for="cn" data-i18n="c.num"></label><input id="cn" inputmode="numeric" autocomplete="cc-number" placeholder="0000 0000 0000 0000"><span class="err-msg"></span></div>
              <div class="field c6" data-f="cname"><label for="cname" data-i18n="c.name"></label><input id="cname" autocomplete="cc-name"><span class="err-msg"></span></div>
              <div class="field c3" data-f="cexp"><label for="cexp" data-i18n="c.exp"></label><input id="cexp" inputmode="numeric" autocomplete="cc-exp" data-i18n-ph="c.expph" placeholder="MM/AA"><span class="err-msg"></span></div>
              <div class="field c3" data-f="ccvv"><label for="ccvv" data-i18n="c.cvv"></label><input id="ccvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123"><span class="err-msg"></span></div>
            </div></div></label>
          <label class="pay-method"><div class="row"><input type="radio" name="pm" value="pse"><span data-i18n="m.pse"></span><span class="logos" aria-hidden="true"><span>PSE</span></span></div>
            <div class="pay-detail"><div class="form-grid">
              <div class="field c3" data-f="bank"><label for="bank" data-i18n="p.bank"></label><select id="bank"></select><span class="err-msg"></span></div>
              <div class="field c3"><label for="ptype" data-i18n="p.type"></label><select id="ptype"><option data-i18n="p.nat"></option><option data-i18n="p.jur"></option></select></div>
            </div></div></label>
          <label class="pay-method"><div class="row"><input type="radio" name="pm" value="apple"><span>Apple Pay</span><span class="logos" aria-hidden="true"><span>Pay</span></span></div>
            <div class="pay-detail"><p style="color:var(--ink-2)" data-i18n="m.apple"></p></div></label>
        </div>
        <div class="note ok" style="margin:18px 0"><span id="lk"></span><span data-i18n="secure"></span></div>
        <button class="btn btn-primary" type="submit" style="width:100%"><span id="payBtn"></span></button>
      </form>

      <aside class="order" aria-label="Resumen">
        <div class="panel">
          <h2 data-i18n="o.h"></h2>
          <dl id="lines"></dl>
          <div class="total"><div><small data-i18n="o.total" style="max-width:none"></small><b class="num" id="tot"></b></div><small data-i18n="o.incl"></small></div>
          <div class="sel"><h3 data-i18n="o.sel"></h3><div id="mini"></div></div>
        </div>
      </aside>
    </div>
  </div>
</main>
<footer id="shell-footer"></footer>
<script src="assets/js/app.js"></script>
<script>
(function () {
  LX.add({
    es: {
      back: "Volver a personalizar", title: "Selecciona tu método de pago", "m.card": "Tarjeta de crédito y débito", "m.pse": "Pago por PSE", "m.apple": "Confirmarás el pago con Face ID o Touch ID en tu dispositivo.",
      "c.num": "Número de tarjeta", "c.name": "Nombre como aparece en la tarjeta", "c.exp": "Vencimiento", "c.cvv": "Código de seguridad", "c.expph": "MM/AA", "p.bank": "Banco", "p.type": "Tipo de persona", "p.nat": "Persona natural", "p.jur": "Persona jurídica", "p.sel": "Selecciona tu banco",
      secure: "Tu pago se procesa de forma segura. Esta es una maqueta: no se realiza ningún cobro real.", pay: "Pagar {total}",
      "o.h": "Resumen de compra", "o.tickets": "Precio de tiquetes", "o.taxes": "Impuestos, tasas y cargos", "o.services": "Precio de servicios", "o.total": "Total", "o.incl": "Incluye impuestos, recargos y servicios.", "o.sel": "Tu selección", "o.out": "Vuelo de salida",
      "e.req": "Campo obligatorio.", "e.card": "Ingresa un número de tarjeta válido.", "e.exp": "Usa el formato MM/AA.", "e.cvv": "3 o 4 dígitos."
    },
    en: {
      back: "Back to customize", title: "Select your payment method", "m.card": "Credit and debit card", "m.pse": "Pay with PSE", "m.apple": "You will confirm the payment with Face ID or Touch ID on your device.",
      "c.num": "Card number", "c.name": "Name as shown on the card", "c.exp": "Expiry date", "c.cvv": "Security code", "c.expph": "MM/YY", "p.bank": "Bank", "p.type": "Account type", "p.nat": "Individual", "p.jur": "Company", "p.sel": "Select your bank",
      secure: "Your payment is processed securely. This is a mockup: no real charge is made.", pay: "Pay {total}",
      "o.h": "Purchase summary", "o.tickets": "Ticket price", "o.taxes": "Taxes, fees and charges", "o.services": "Services", "o.total": "Total", "o.incl": "Includes taxes, surcharges and services.", "o.sel": "Your selection", "o.out": "Outbound flight",
      "e.req": "Required field.", "e.card": "Enter a valid card number.", "e.exp": "Use MM/YY format.", "e.cvv": "3 or 4 digits."
    }
  });
  var S = LX.ensureFare(), $ = function (id) { return document.getElementById(id); };
  LX.init({ kind: "co", step: 4 });
  $("bi").innerHTML = LX.ico("arrow-left"); $("lk").innerHTML = LX.ico("lock");
  var BANKS = ["Bancolombia", "Davivienda", "Banco de Bogotá", "BBVA", "Nequi", "Banco Popular"];

  function render() {
    S = LX.state(); var T = LX.totals(), info = LX.routeInfo(S.from, S.to), ft = LX.flightTimes(S.depTime || info.dep, info.dur, info.tz);
    $("lines").innerHTML = [["o.tickets", T.tickets], ["o.taxes", T.taxes], ["o.services", T.services]].map(function (l) { return "<div><dt>" + LX.t(l[0]) + '</dt><dd class="num" style="margin:0">' + LX.money(l[1]) + "</dd></div>"; }).join("");
    $("tot").textContent = LX.money(T.total);
    $("payBtn").textContent = LX.t("pay", { total: LX.money(T.total) });
    $("mini").innerHTML = '<small style="color:var(--gray);display:block;margin-bottom:8px">' + LX.t("o.out") + " · " + LX.fmtDate(S.dep, { weekday: "short", day: "numeric", month: "short" }) + '</small><div class="mini-flight"><span class="num">' + ft.dep + "<small>" + S.from + '</small></span><span style="color:var(--red)">' + LX.ico("plane") + '</span><span class="num" style="text-align:right">' + ft.arr + "<small>" + S.to + '</small></span></div><span class="badge">' + LX.fareLabel(S.fare) + "</span> <small style=\"margin-left:8px;color:var(--gray)\">LF926</small>";
    var b = $("bank"), v = b.value; b.innerHTML = '<option value="">' + LX.t("p.sel") + "</option>" + BANKS.map(function (x) { return "<option>" + x + "</option>"; }).join(""); b.value = v;
  }
  function err(f, m) { var el = document.querySelector('[data-f="' + f + '"]'); el.classList.toggle("invalid", !!m); el.querySelector(".err-msg").textContent = m || ""; return !!m; }
  $("cn").addEventListener("input", function () { var d = this.value.replace(/\D/g, "").slice(0, 16); this.value = d.replace(/(.{4})/g, "$1 ").trim(); });
  $("cexp").addEventListener("input", function () { var d = this.value.replace(/\D/g, "").slice(0, 4); this.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d; });
  document.querySelectorAll(".field input,.field select").forEach(function (el) { el.addEventListener("input", function () { el.closest(".field").classList.remove("invalid"); }); });
  $("payForm").addEventListener("submit", function (e) {
    e.preventDefault(); var pm = document.querySelector("input[name=pm]:checked").value, bad = false;
    if (pm === "card") {
      var n = $("cn").value.replace(/\s/g, ""), x = $("cexp").value;
      bad = err("cn", !/^\d{13,16}$/.test(n) && LX.t("e.card")) | bad; bad = err("cname", !$("cname").value.trim() && LX.t("e.req")) | bad;
      var okExp = /^(0[1-9]|1[0-2])\/\d{2}$/.test(x); bad = err("cexp", !okExp && LX.t("e.exp")) | bad; bad = err("ccvv", !/^\d{3,4}$/.test($("ccvv").value) && LX.t("e.cvv")) | bad;
    } else if (pm === "pse") { bad = err("bank", !$("bank").value && LX.t("e.req")) | bad; }
    if (bad) { var f = document.querySelector(".field.invalid input,.field.invalid select"); f && f.focus(); return; }
    var code = ""; for (var i = 0; i < 6; i++) code += "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)];
    LX.save({ pay: pm, code: code, paid: LX.totals().total }); location.href = "confirmacion.html";
  });
  LX.onLang(function () { render(); var pse = document.querySelector("input[value=pse]"), en = LX.lang() === "en"; pse.closest("label").hidden = en; if (en && pse.checked) document.querySelector("input[value=card]").checked = true; LX.apply(); });
})();
</script>
</body>
</html>
