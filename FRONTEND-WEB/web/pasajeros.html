<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifex — Información de pasajeros</title>
<link rel="icon" href="assets/logo/lifex-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/lifex.css">
</head>
<body data-page="passengers">
<header id="shell-header"></header>
<main id="main" class="co-main">
  <div class="wrap" style="max-width:1000px">
    <h1 class="co-title" data-i18n="title"></h1>
    <div class="note info" style="margin:18px 0 22px"><span id="i1"></span><span data-i18n="hint"></span></div>
    <div class="stack" id="forms"></div>
  </div>
</main>
<footer id="shell-footer"></footer>
<script src="assets/js/app.js"></script>
<script>
(function () {
  LX.add({
    es: {
      title: "Información de pasajeros", hint: "Ingresa la información tal como aparece en el documento de viaje.",
      "adult.n": "Adulto {n}", gender: "Género", "g.m": "Masculino", "g.f": "Femenino", "g.x": "Sin especificar", names: "Nombre(s)*", last: "Apellido(s)*", dob: "Fecha de nacimiento*", day: "Día", month: "Mes", year: "Año",
      nat: "Nacionalidad del documento de viaje*", "nat.ph": "Selecciona", hasLx: "Tengo número lifexperience u otro programa", lxNo: "Número de socio", assist: "Servicios de accesibilidad y asistencia (opcional)", assistTxt: "Cuéntanos qué necesitas",
      holder: "Titular de la reserva", "holder.p": "Será la persona a la cual contactaremos para informarle sobre la reserva y administrar reembolsos.", pax: "Pasajero*", prefix: "Prefijo*", phone: "Teléfono móvil*", email: "Correo electrónico*", email2: "Confirma tu correo electrónico*",
      c1: "Acepto el tratamiento de mis datos personales de conformidad con la política de privacidad.", c2: "Acepto el uso de mis datos personales para recibir promociones, ofertas y novedades de lifex.",
      "e.req": "Campo obligatorio.", "e.dob": "Revisa la fecha de nacimiento (mínimo 12 años).", "e.mail": "Ingresa un correo válido.", "e.mail2": "Los correos no coinciden.", "e.phone": "Ingresa solo dígitos (7 a 12).", "e.c1": "Debes aceptar para continuar.",
      months: "enero,febrero,marzo,abril,mayo,junio,julio,agosto,septiembre,octubre,noviembre,diciembre",
      nats: "Colombia,Argentina,Brasil,Chile,Ecuador,España,Estados Unidos,México,Perú,Reino Unido,Venezuela,Otra"
    },
    en: {
      title: "Passenger information", hint: "Enter the information exactly as it appears on the travel document.",
      "adult.n": "Adult {n}", gender: "Gender", "g.m": "Male", "g.f": "Female", "g.x": "Unspecified", names: "First name(s)*", last: "Last name(s)*", dob: "Date of birth*", day: "Day", month: "Month", year: "Year",
      nat: "Nationality on travel document*", "nat.ph": "Select", hasLx: "I have a lifexperience number or another program", lxNo: "Member number", assist: "Accessibility and assistance services (optional)", assistTxt: "Tell us what you need",
      holder: "Booking holder", "holder.p": "This is the person we will contact about the booking and to manage refunds.", pax: "Passenger*", prefix: "Prefix*", phone: "Mobile phone*", email: "Email*", email2: "Confirm your email*",
      c1: "I accept the processing of my personal data in accordance with the privacy policy.", c2: "I accept the use of my personal data to receive lifex promotions, offers and news.",
      "e.req": "Required field.", "e.dob": "Check the date of birth (minimum age 12).", "e.mail": "Enter a valid email.", "e.mail2": "Emails do not match.", "e.phone": "Digits only (7 to 12).", "e.c1": "You must accept to continue.",
      months: "January,February,March,April,May,June,July,August,September,October,November,December",
      nats: "Colombia,Argentina,Brazil,Chile,Ecuador,Spain,United States,Mexico,Peru,United Kingdom,Venezuela,Other"
    }
  });
  var S = LX.ensureFare(), $ = function (id) { return document.getElementById(id); };
  var N = S.pax || 1, PRE = ["+57", "+1", "+34", "+44", "+52", "+51", "+54", "+55", "+56", "+58"];
  var data = { pax: (S.passengers || []).slice(0, N), holder: S.holder || {} }, open = 0;

  function ok(i) { return !!(data.pax[i] && data.pax[i].ok); }
  function allOk() { var a = true; for (var i = 0; i < N; i++) a = a && ok(i); return a && data.holder.ok; }
  LX.init({ kind: "co", step: 2, summary: {
    back: "resumen.html", ready: allOk, next: "personaliza.html",
    onNext: function () { LX.save({ passengers: data.pax, holder: data.holder }); },
    onBlocked: function () { var f = document.querySelector(".acc:not(.valid)"); if (f) { f.classList.add("open"); var b = f.querySelector("[data-submit]"); b && b.click(); f.scrollIntoView({ behavior: "smooth", block: "center" }); } }
  } });
  $("i1").innerHTML = LX.ico("info");

  function opts(list, sel, ph) { return (ph ? '<option value="">' + ph + "</option>" : "") + list.map(function (x, i) { var v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x; return '<option value="' + v + '"' + (String(v) === String(sel) ? " selected" : "") + ">" + l + "</option>"; }).join(""); }
  function fld(cls, id, label, inner) { return '<div class="field ' + cls + '" data-f="' + id + '"><label for="' + id + '">' + label + "</label>" + inner + '<span class="err-msg"></span></div>'; }

  function paxForm(i) {
    var d = data.pax[i] || {}, months = LX.t("months").split(","), nats = LX.t("nats").split(",");
    var days = []; for (var k = 1; k <= 31; k++) days.push(k);
    var yrs = []; for (var y = 2014; y >= 1930; y--) yrs.push(y);
    var name = d.ok ? ' <b style="font-weight:500;margin-left:6px">' + d.first + " " + d.last + "</b>" : "";
    return '<section class="acc' + (open === i ? " open" : "") + (d.ok ? " valid" : "") + '" data-i="' + i + '"><button class="acc-head" type="button" aria-expanded="' + (open === i) + '">' +
      LX.t("adult.n", { n: i + 1 }) + name + '<span class="done-mark">' + LX.ico("check") + '</span><span class="chev">' + LX.ico("chev") + '</span></button><div class="acc-body"><form novalidate><div class="form-grid">' +
      fld("c2", "g" + i, LX.t("gender"), '<select id="g' + i + '"><option value="m">' + LX.t("g.m") + '</option><option value="f"' + (d.g === "f" ? " selected" : "") + ">" + LX.t("g.f") + '</option><option value="x"' + (d.g === "x" ? " selected" : "") + ">" + LX.t("g.x") + "</option></select>") +
      fld("c2", "n" + i, LX.t("names"), '<input id="n' + i + '" autocomplete="given-name" value="' + (d.first || "") + '">') +
      fld("c2", "l" + i, LX.t("last"), '<input id="l' + i + '" autocomplete="family-name" value="' + (d.last || "") + '">') +
      '<div class="field c4" data-f="dob' + i + '"><label>' + LX.t("dob") + '</label><div class="dob"><select aria-label="' + LX.t("day") + '" id="dd' + i + '">' + opts(days, d.dd, LX.t("day")) + '</select><select aria-label="' + LX.t("month") + '" id="dm' + i + '">' + opts(months.map(function (m, j) { return [j + 1, m]; }), d.dm, LX.t("month")) + '</select><select aria-label="' + LX.t("year") + '" id="dy' + i + '">' + opts(yrs, d.dy, LX.t("year")) + '</select></div><span class="err-msg"></span></div>' +
      fld("c2", "nat" + i, LX.t("nat"), '<select id="nat' + i + '">' + opts(nats, d.nat, LX.t("nat.ph")) + "</select>") +
      '<div class="c6"><label class="check"><input type="checkbox" id="hl' + i + '"' + (d.hasLx ? " checked" : "") + "><span>" + LX.t("hasLx") + '</span></label></div>' +
      fld("c3", "lx" + i, LX.t("lxNo"), '<input id="lx' + i + '" inputmode="numeric" value="' + (d.lx || "") + '">').replace('class="field c3"', 'class="field c3" style="' + (d.hasLx ? "" : "display:none") + '"') +
      '<div class="c6"><label class="switch"><input type="checkbox" id="as' + i + '"' + (d.assist ? " checked" : "") + "><span>" + LX.t("assist") + "</span></label></div>" +
      '</div><div class="form-actions"><span></span><button class="btn btn-ghost" type="submit" data-submit>' + LX.t("next") + "</button></div></form></div></section>";
  }
  function holderForm() {
    var h = data.holder, ps = []; for (var i = 0; i < N; i++) ps.push([i, (data.pax[i] && data.pax[i].ok) ? data.pax[i].first + " " + data.pax[i].last : LX.t("adult.n", { n: i + 1 })]);
    var isOpen = open === "h";
    return '<section class="acc' + (isOpen ? " open" : "") + (h.ok ? " valid" : "") + '" data-i="h"><button class="acc-head" type="button" aria-expanded="' + isOpen + '">' + LX.t("holder") + '<span class="done-mark">' + LX.ico("check") + '</span><span class="chev">' + LX.ico("chev") + '</span></button><div class="acc-body"><p>' + LX.t("holder.p") + '</p><form novalidate><div class="form-grid">' +
      fld("c6", "hp", LX.t("pax"), '<select id="hp">' + opts(ps, h.p || 0) + "</select>") +
      fld("c2", "pre", LX.t("prefix"), '<select id="pre">' + opts(PRE, h.pre || "+57") + "</select>") +
      fld("c4", "ph", LX.t("phone"), '<input id="ph" inputmode="tel" autocomplete="tel-national" value="' + (h.ph || "") + '">') +
      fld("c3", "em", LX.t("email"), '<input id="em" type="email" autocomplete="email" value="' + (h.em || "") + '">') +
      fld("c3", "em2", LX.t("email2"), '<input id="em2" type="email" value="' + (h.em2 || "") + '">') +
      '<div class="c6"><label class="check"><input type="checkbox" id="c1"' + (h.c1 ? " checked" : "") + "><span>" + LX.t("c1") + '</span></label><span class="err-msg" id="c1e" style="margin-left:32px"></span></div>' +
      '<div class="c6"><label class="check"><input type="checkbox" id="c2"' + (h.c2 ? " checked" : "") + "><span>" + LX.t("c2") + '</span></label></div></div><div class="form-actions"><span></span><button class="btn btn-ghost" type="submit" data-submit>' + LX.t("next") + "</button></div></form></div></section>";
  }
  function setErr(row, key, on) { var f = row.querySelector('[data-f="' + key + '"]'); if (!f) return; f.classList.toggle("invalid", !!on); f.querySelector(".err-msg").textContent = on || ""; }

  function render() {
    var h = ""; for (var i = 0; i < N; i++) h += paxForm(i); h += holderForm();
    $("forms").innerHTML = h; wire(); LX.refreshSummary();
  }
  function wire() {
    document.querySelectorAll(".acc").forEach(function (acc) {
      var i = acc.getAttribute("data-i"), idx = i === "h" ? "h" : +i;
      acc.querySelector(".acc-head").addEventListener("click", function () { open = open === idx ? null : idx; document.querySelectorAll(".acc").forEach(function (a) { var o = a.getAttribute("data-i") == String(open); a.classList.toggle("open", o); a.querySelector(".acc-head").setAttribute("aria-expanded", o); }); });
      var form = acc.querySelector("form");
      if (idx === "h") {
        form.addEventListener("submit", function (e) { e.preventDefault(); validateHolder(acc); });
      } else {
        var hl = acc.querySelector("#hl" + idx); hl.addEventListener("change", function () { acc.querySelector('[data-f="lx' + idx + '"]').style.display = hl.checked ? "" : "none"; });
        form.addEventListener("submit", function (e) { e.preventDefault(); validatePax(acc, idx); });
      }
      form.querySelectorAll("input,select").forEach(function (el) { el.addEventListener("input", function () { var f = el.closest(".field"); if (f) { f.classList.remove("invalid"); } }); });
    });
  }
  function validatePax(acc, i) {
    var v = function (id) { return acc.querySelector("#" + id).value.trim(); }, bad = false, msg = LX.t("e.req");
    var first = v("n" + i), last = v("l" + i), nat = v("nat" + i), dd = +v("dd" + i), dm = +v("dm" + i), dy = +v("dy" + i);
    var e1 = first.length < 2, e2 = last.length < 2, e3 = !nat;
    var dobOk = false; if (dd && dm && dy) { var dt = new Date(dy, dm - 1, dd); dobOk = dt.getMonth() === dm - 1 && dt.getDate() === dd && (2026 - dy) >= 12; }
    setErr(acc, "n" + i, e1 && msg); setErr(acc, "l" + i, e2 && msg); setErr(acc, "nat" + i, e3 && msg); setErr(acc, "dob" + i, !dobOk && LX.t("e.dob"));
    if (e1 || e2 || e3 || !dobOk) { data.pax[i] = Object.assign(data.pax[i] || {}, { ok: false }); LX.refreshSummary(); return; }
    data.pax[i] = { ok: true, g: v("g" + i), first: first, last: last, dd: dd, dm: dm, dy: dy, nat: nat, hasLx: acc.querySelector("#hl" + i).checked, lx: v("lx" + i), assist: acc.querySelector("#as" + i).checked };
    open = i + 1 < N ? i + 1 : "h"; LX.save({ passengers: data.pax }); render();
    var t = document.querySelector('.acc[data-i="' + open + '"]'); t && t.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function validateHolder(acc) {
    var v = function (id) { return acc.querySelector("#" + id).value.trim(); }, msg = LX.t("e.req");
    var ph = v("ph").replace(/[\s-]/g, ""), em = v("em"), em2 = v("em2"), c1 = acc.querySelector("#c1").checked;
    var phBad = !/^\d{7,12}$/.test(ph), emBad = !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(em), em2Bad = em2.toLowerCase() !== em.toLowerCase();
    setErr(acc, "ph", phBad && LX.t("e.phone")); setErr(acc, "em", emBad && LX.t("e.mail")); setErr(acc, "em2", !emBad && em2Bad && LX.t("e.mail2") || (emBad && !em2 && msg));
    acc.querySelector("#c1e").textContent = c1 ? "" : LX.t("e.c1");
    if (phBad || emBad || em2Bad || !c1) { data.holder.ok = false; LX.refreshSummary(); return; }
    data.holder = { ok: true, p: +v("hp"), pre: v("pre"), ph: ph, em: em, em2: em2, c1: c1, c2: acc.querySelector("#c2").checked };
    LX.save({ holder: data.holder }); open = null; render();
  }
  LX.onLang(function () { render(); LX.apply(); });
})();
</script>
</body>
</html>
