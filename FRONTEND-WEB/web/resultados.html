<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lifex — Selecciona tu vuelo</title>
<link rel="icon" href="assets/logo/lifex-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/lifex.css">
</head>
<body data-page="results">
<header id="shell-header"></header>
<main id="main" class="co-main">
  <div class="wrap">
    <a class="back-link" href="index.html"><span id="backIco"></span><span data-i18n="modify"></span></a>
    <h1 class="co-title" id="title"></h1>
    <p class="co-sub" id="subtitle"></p>

    <div class="date-strip" id="dates" role="group" data-i18n-aria="dates.aria"></div>

    <div class="filters" role="group" data-i18n-aria="filters">
      <span data-i18n="filters"></span>
      <button class="fchip" type="button" aria-pressed="true" id="fDirect"><span data-i18n="f.direct"></span></button>
      <button class="fchip" type="button" aria-pressed="false" id="fBiz"><span data-i18n="cabin.business"></span></button>
      <button class="fchip" type="button" aria-pressed="false" id="fPrice"><span data-i18n="f.price"></span></button>
    </div>

    <div id="flights"></div>
    <div style="text-align:center;margin:26px 0 34px"><button class="btn btn-ghost" id="more" type="button" data-i18n="more"></button></div>

    <div class="acc" id="cond">
      <button class="acc-head" type="button" aria-expanded="false"><span data-i18n="cond"></span><span class="chev" id="chev"></span></button>
      <div class="acc-body"><p style="margin:0;color:var(--ink-2)" data-i18n="cond.p"></p></div>
    </div>
  </div>
</main>
<footer id="shell-footer"></footer>

<script src="assets/js/app.js"></script>
<script>
(function () {
  LX.add({
    es: {
      modify: "Modificar búsqueda", title: "Ida: {from} a {to}", filters: "Filtrar por:", "f.direct": "Vuelos directos", "f.price": "Mejor precio",
      "dates.aria": "Fechas cercanas", more: "Mostrar todos los vuelos", cond: "Condiciones tarifarias", select: "Ver tarifas", lowest: "Más barato",
      "cond.p": "Las tarifas Light no incluyen cambios ni reembolsos. Classic permite elegir asiento Economy. Flex incluye cambios y reembolsos antes del vuelo. Business incluye equipaje de bodega, servicio prioritario y asiento flatbed.",
      "f.none": "No hay vuelos con estos filtros.", sub: "{n} vuelos disponibles. Precio por pasajero, impuestos incluidos.", sub1: "1 vuelo disponible. Precio por pasajero, impuestos incluidos."
    },
    en: {
      modify: "Modify search", title: "Outbound: {from} to {to}", filters: "Filter by:", "f.direct": "Nonstop flights", "f.price": "Best price",
      "dates.aria": "Nearby dates", more: "Show all flights", cond: "Fare conditions", select: "View fares", lowest: "Lowest",
      "cond.p": "Light fares do not include changes or refunds. Classic lets you choose an Economy seat. Flex includes changes and refunds before the flight. Business includes checked baggage, priority service and a flatbed seat.",
      "f.none": "No flights match these filters.", sub: "{n} flights available. Price per passenger, taxes included.", sub1: "1 flight available. Price per passenger, taxes included."
    }
  });
  LX.init({ kind: "co", step: 1 });
  var S = LX.state(), $ = function (id) { return document.getElementById(id); };
  var VAR = [1.18, .98, 1, 1, 1, 1.02, 1.06], showAll = false, sortPrice = false, bizOnly = false;

  function addDays(iso, n) { var p = iso.split("-"), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
  function dayPrice(i) { return Math.round(LX.farePrice("light", S) * VAR[i] / 100) * 100; }

  function dates() {
    var base = "2026-11-24", start = S.dep > addDays(base, 0) ? S.dep : base; // center on chosen date
    var out = "", min = Math.min.apply(null, VAR.map(function (v, i) { return dayPrice(i); }));
    for (var i = 0; i < 7; i++) {
      var d = addDays(S.dep, i - 3), p = dayPrice(i);
      out += '<button class="date-btn' + (p === min ? " lowest" : "") + '" type="button" data-d="' + d + '" aria-pressed="' + (d === S.dep) + '"><span>' + LX.fmtDate(d, { weekday: "short", day: "numeric", month: "short" }) + '</span><span class="price num">' + LX.money(p) + "</span></button>";
    }
    $("dates").innerHTML = out;
    $("dates").querySelectorAll(".date-btn").forEach(function (b) { b.addEventListener("click", function () { var d = b.getAttribute("data-d"); S.dep = d; LX.save({ dep: d }); render(); LX.refresh(); }); });
  }
  function list() {
    var info = LX.routeInfo(S.from, S.to), sh = [0, 240, 480], items = [];
    var n = info.dur > 300 ? 2 : 3;
    for (var i = 0; i < n; i++) {
      var ft = LX.flightTimes(info.dep, info.dur, info.tz, sh[i] * (info.dur > 300 ? 2 : 1));
      var vi = [3, 2, 4][i], price = Math.round(LX.farePrice("light", S) * (i === 0 ? 1 : i === 1 ? 1.04 : .97) / 100) * 100;
      items.push({ ft: ft, price: price, i: i });
    }
    if (sortPrice) items.sort(function (a, b) { return a.price - b.price; });
    if (!showAll) items = items.slice(0, 1);
    return items;
  }
  function flights() {
    var items = list();
    $("flights").innerHTML = items.length ? items.map(function (f, k) {
      var no = (900 + S.to.charCodeAt(0) % 50 + f.i * 4);
      return '<article class="flight-card"><div class="flight-main">' +
        '<div class="fl-time num">' + f.ft.dep + "<small>" + S.from + '</small></div>' +
        '<div class="fl-line"><b>' + LX.t("direct") + "</b> · " + LX.dur(LX.routeInfo(S.from, S.to).dur) + '<div class="track">' + LX.ico("plane") + "</div>" + LX.t("operated") + " · LF" + no + "</div>" +
        '<div class="fl-time num" style="text-align:right">' + f.ft.arr + (f.ft.next ? '<sup style="font:500 13px var(--font-text);color:var(--gray);margin-left:4px">' + LX.t("next.day") + "</sup>" : "") + "<small>" + S.to + "</small></div></div>" +
        '<div class="flight-price"><small>' + LX.t("from") + '</small><span class="price num">' + LX.money(f.price) + '</span><button class="btn btn-primary btn-sm pick" type="button" data-t="' + f.ft.dep + '">' + LX.t("select") + "</button></div></article>";
    }).join("") : '<p class="note">' + LX.t("f.none") + "</p>";
    $("flights").querySelectorAll(".pick").forEach(function (b) { b.addEventListener("click", function () { LX.save({ depTime: b.getAttribute("data-t"), cabin: bizOnly ? "business" : "economy" }); location.href = "tarifas.html"; }); });
  }
  function render() {
    S = LX.state();
    $("title").textContent = LX.t("title", { from: LX.city(S.from), to: LX.city(S.to) });
    var all = LX.routeInfo(S.from, S.to).dur > 300 ? 2 : 3; $("subtitle").textContent = all === 1 ? LX.t("sub1") : LX.t("sub", { n: showAll ? list().length : all });
    dates(); flights();
  }
  $("backIco").innerHTML = LX.ico("arrow-left"); $("chev").innerHTML = LX.ico("chev");
  $("fDirect").addEventListener("click", function () { var on = this.getAttribute("aria-pressed") !== "true"; this.setAttribute("aria-pressed", on); });
  $("fBiz").addEventListener("click", function () { bizOnly = this.getAttribute("aria-pressed") !== "true"; this.setAttribute("aria-pressed", bizOnly); });
  $("fPrice").addEventListener("click", function () { sortPrice = this.getAttribute("aria-pressed") !== "true"; this.setAttribute("aria-pressed", sortPrice); flights(); });
  $("more").addEventListener("click", function () { showAll = !showAll; this.style.display = "none"; render(); });
  var acc = $("cond"); acc.querySelector(".acc-head").addEventListener("click", function () { var o = acc.classList.toggle("open"); this.setAttribute("aria-expanded", o); });
  LX.onLang(function () { render(); LX.apply(); });
})();
</script>
</body>
</html>
